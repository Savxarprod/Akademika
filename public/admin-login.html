<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — Akademika</title>
  <link rel="icon" type="image/jpg" href="img/logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="noise"></div>
  <div class="aurora aurora-one"></div>
  <div class="aurora aurora-two"></div>

  <main class="admin-wrap">
    <div class="section-heading">
      <span>Admin</span>
      <h2>Вход в админ-панель</h2>
    </div>

    <form id="loginForm" class="request-form" style="max-width: 480px; margin: 0 auto;">
      <div class="form-glow"></div>

      <label class="full">
        <span>Логин</span>
        <input type="text" name="login" required autocomplete="username">
      </label>

      <label class="full">
        <span>Пароль</span>
        <input type="password" name="password" required autocomplete="current-password">
      </label>

      <button type="submit" class="submit-button">
        Войти
        <span></span>
      </button>

      <p class="form-message" id="loginMessage"></p>
    </form>
  </main>

  <script>
  const form = document.getElementById('loginForm');
  const message = document.getElementById('loginMessage');
  let twoFactorRequired = false;

  form.addEventListener('submit', async e => {
    e.preventDefault();
    message.textContent = 'Проверяем...';
    message.style.color = '#b9bfd8';

    const formData = new FormData(form);
    const data = Object.fromEntries(formData.entries());

    // Если уже запрошен 2FA-код, добавляем его в payload
    if (twoFactorRequired) {
      data.totpCode = formData.get('totpCode');
    }

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();

      if (result.success) {
        message.textContent = 'Успешно. Перенаправляем...';
        message.style.color = '#4ade80';
        window.location.href = '/admin.html';
      } else if (result.require2FA) {
        // Показываем поле для ввода кода
        if (!twoFactorRequired) {
          twoFactorRequired = true;
          const totpField = document.createElement('label');
          totpField.className = 'full';
          totpField.innerHTML = `
            <span>Код из приложения-аутентификатора</span>
            <input type="text" name="totpCode" placeholder="000000" maxlength="6" required autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}">
          `;
          form.insertBefore(totpField, form.querySelector('button[type="submit"]'));
        }
        message.textContent = result.message || 'Введите код 2FA';
        message.style.color = '#fb7185';
      } else {
        message.textContent = result.message || 'Ошибка входа';
        message.style.color = '#fb7185';
      }
    } catch (err) {
      message.textContent = 'Ошибка соединения с сервером';
      message.style.color = '#fb7185';
    }
  });
</script>
</body>
</html>
